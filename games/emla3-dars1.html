<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>املای فارسی: محلّه‌ی ما</title>
<style>
:root{--sky:#dff1f7;--grass:#cfe8b8;--ink:#2d3a3a;--card:#fffdf6;--tile:#fff3cf;--ok:#7fc58a;--soft:#f3c9a0;--btn:#4b9a8f;--btn2:#e8a64c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Vazirmatn,"Noto Naskh Arabic",Tahoma,system-ui,sans-serif;font-size:22px;color:var(--ink);background:var(--grass) center/cover fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:12px 14px 30px}
button{font:inherit;color:inherit;border:0;border-radius:18px;padding:12px 18px;background:var(--btn);color:#fff;min-height:56px;cursor:pointer}
button.alt{background:var(--btn2)}button.ghost{background:#fff;color:var(--ink);border:2px solid #b9d3cf}
button:disabled{opacity:.45}
.card{background:var(--card);border-radius:24px;padding:16px;margin-top:10px;text-align:center;box-shadow:0 2px 0 #c9dcc0}
.head{display:flex;align-items:center;gap:10px}
.cat{width:64px;height:64px;object-fit:contain}.st{width:50px}.bub{flex:1;background:#fff;border-radius:16px;padding:8px 12px;font-size:19px}
.prog{height:10px;background:#e3efe0;border-radius:8px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}
.lbl{font-size:21px;margin-bottom:8px}.big{font-size:46px;margin:8px 0}
.pic{max-width:100%;max-height:200px;object-fit:contain;display:block;margin:4px auto}
.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--btn2);transition:width 3s linear}
.ans{min-height:76px;border:3px dashed #b9d3cf;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.t{background:var(--tile);color:var(--ink);min-width:58px;min-height:62px;font-size:32px;padding:6px 10px;border:2px solid #ecd493}.t.sm{font-size:16px}.t.used{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.opt{display:block;width:100%;margin:10px 0;background:#fff;color:var(--ink);border:3px solid #b9d3cf;font-size:34px}
.opt.good{background:#d5efd8;border-color:var(--ok)}.opt.soft{background:#fbe6d0;border-color:var(--soft)}
.bl{background:#fff3cf;border-radius:10px;padding:0 8px;font-size:30px}
.sent{font-size:26px;line-height:1.9;margin:8px 0}
input{font:inherit;font-size:30px;width:100%;padding:10px;border-radius:14px;border:3px solid #b9d3cf;text-align:center}
.fb{position:fixed;inset:0;background:rgba(45,58,58,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.fb>div{background:#fffdf6;border-radius:26px;padding:22px;max-width:420px;width:100%;text-align:center}
.lv{display:flex;align-items:center;justify-content:space-between;width:100%;margin:10px 0;min-height:70px;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:6px;border-bottom:1px solid #ddd}.flag{background:#fff0cf}
.note{background:#fff3cf;border-radius:12px;padding:8px 12px;font-size:16px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>

const PRAISE=["آفرین!","عالی بود!","چه خوب!","دمت گرم!","درست است!"];
const ZW="\u200c";
const S={stats:{},rep:{},stars:{}};let noVoice=false;
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.replace(/[\u200c\u0651\s]/g,"").replace(/ي/g,"ی").replace(/ك/g,"ک");
const tok=w=>w.match(/[^\u0651]\u0651?/gu);
function noV(){noVoice=true;document.querySelectorAll(".nvb").forEach(x=>x.style.display="block")}
let CA=null;
function speak(t){try{if(CA)CA.pause();if(typeof AUD!=="undefined"&&AUD[t]){CA=new Audio(AUD[t]);CA.play().catch(()=>speakTTS(t));return}}catch(e){}speakTTS(t)}
function speakTTS(t){try{if(!("speechSynthesis" in window)){noV();return}
 const u=new SpeechSynthesisUtterance(t);u.lang="fa-IR";u.rate=.8;
 const v=speechSynthesis.getVoices().find(x=>/^fa/i.test(x.lang));if(v)u.voice=v;
 u.onerror=()=>noV();speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){noV()}}
function testSound(){const d=$("#diag");d.style.display="block";try{const vs=speechSynthesis.getVoices();d.textContent="تعداد صداهای دستگاه: "+vs.length+"، صدای فارسی: "+vs.filter(x=>/^fa/i.test(x.lang)).length+". اگر صدایی نشنیدید، پیام بالا را ببینید."}catch(e){d.textContent="این مرورگر از خواندن صدا پشتیبانی نمی‌کند."}speak("سلام")}
const GI=[1,3,4,5,6];
function pic(w){return w.image?`<img class="pic" alt="" src="${IMG[w.image]}">`:""}
function head(msg,p){const tot=S.done+S.q.length||1;
 return `<div class="head"><img class="cat" alt="" src="${IMG["c"+(p||1)]}"><div class="bub">${msg||"بیا با هم بنویسیم!"}</div></div><div class="prog"><i style="width:${S.done/tot*100}%"></i></div><div class="note nvb" style="display:${noVoice?"block":"none"}">پیام برای معلم: صدای فارسی روی این دستگاه کار نکرد و بازی بی‌صدا ادامه می‌یابد. در تنظیمات گوشی، «تبدیل متن به گفتار» (Google) را باز کنید و زبان فارسی را نصب کنید، یا فایل را با Chrome باز کنید.</div>`}
function home(){S.q=[];S.done=0;
 const grow=Object.keys(S.stars).length;
 app.innerHTML=`<div class="head"><img class="cat" alt="" src="${IMG.c1}"><div class="bub">سلام! من راهنمای تو در بوستان محله‌ام. یک مسیر انتخاب کن.</div></div>
 <div class="card"><img class="pic" style="max-height:110px" alt="" src="${IMG["r"+GI[grow]]}">${grow?"<div>باغ من</div>":""}
 ${LVN.map((n,i)=>`<button class="lv ${S.stars[i+1]?"alt":""}" onclick="start(${i+1})"><span>مرحله ${i+1}: ${n}</span><span>${S.stars[i+1]?"⭐".repeat(S.stars[i+1]):"▶"}</span></button>`).join("")}
 <div class="row"><button class="ghost" onclick="testSound()">🔊 آزمایش صدا</button><button class="ghost" onclick="report()">گزارش معلم</button></div><div id="diag" class="note" style="display:none"></div></div>
 <div class="note nvb" style="display:none">پیام برای معلم: صدای فارسی روی این دستگاه کار نکرد و بازی بی‌صدا ادامه می‌یابد. در تنظیمات گوشی، «تبدیل متن به گفتار» (Google) را باز کنید و زبان فارسی را نصب کنید، یا فایل را با Chrome باز کنید.</div>`}
function start(n){const ws=WORDS.filter(w=>w.level==n);S.lv=n;S.ws=ws;S.rev=false;S.wrongSet=new Set();S.done=0;S.q=[];
 ws.forEach(w=>S.stats[w.word]={ok:0,wrong:0,slow:0});
 const P=[[1,2],[2,3],[3,1],[1,3]];[0,1].forEach(k=>shuf(ws.map((w,i)=>({w,t:P[i%4][k]}))).forEach(x=>S.q.push(x)));next()}
function next(){S.fbOpen=false;
 if(!S.q.length){if(!S.rev&&S.wrongSet.size){S.rev=true;S.q=[...S.wrongSet].map(x=>({w:WORDS.find(y=>y.word==x),t:2,r:1}));return next()}return finish()}
 S.cur=S.q.shift();S.t0=Date.now();[0,g1,g2,g3][S.cur.t]()}
function answer(ok){const c=S.cur,st=S.stats[c.w.word],dt=(Date.now()-S.t0)/1000;
 if(ok){if(!c.r){st.ok++;if(dt>20)st.slow++}S.done++;
  app.insertAdjacentHTML("beforeend",`<div class="fb"><div><img class="cat" style="width:120px;height:120px" alt="" src="${IMG.c4}"><div style="font-size:30px">${PRAISE[Math.random()*5|0]}</div><div class="big">${c.w.word}</div></div></div>`);setTimeout(next,800)}
 else{st.wrong++;S.wrongSet.add(c.w.word);S.q.splice(Math.min(3,S.q.length),0,{w:c.w,t:c.t,r:c.r});
  app.insertAdjacentHTML("beforeend",`<div class="fb"><div><img class="cat" style="width:100px;height:100px" alt="" src="${IMG.c5}"><div>نزدیک بود! شکل درست این است:</div><div class="big">${c.w.word}</div>${c.w.hint?`<div class="note">${c.w.hint}</div>`:""}<div style="margin:8px 0">کمی بعد دوباره امتحان می‌کنیم.</div><button onclick="next()">ادامه</button></div></div>`)}}
/* بازی ۱: دیدن، پوشاندن، ساختن */
function g1(){const w=S.cur.w;S.mode="tile";
 app.innerHTML=head(S.cur.r?"مرور: دوباره بساز!":"خوب نگاه کن!",6)+`<div class="card"><div class="lbl">واژه را به خاطر بسپار</div>${pic(w)}<div class="big">${w.word}</div><div class="bar"><i id="tb"></i></div><button class="ghost" style="margin-top:10px" onclick="speak('${w.word}')">🔊 دوباره بشنو</button> <button style="margin-top:10px" onclick="skip()">آماده‌ام</button></div>`;
 speak(w.word);setTimeout(()=>{const b=$("#tb");b&&(b.style.width="0")},50);S.tm=setTimeout(g1b,3200);S.cur.tm=S.tm}
function skip(){clearTimeout(S.tm);g1b()}
function g1b(){const w=S.cur.w;if(S.fbOpen)return;S.t0=Date.now();
 const tk=tok(w.word);const g=CONF.find(x=>x.includes(w.hardLetter))||"";
 S.tiles=shuf([...tk,...shuf([...g].filter(c=>c!==w.hardLetter)).slice(0,2)]).map(t=>({t,u:0}));S.pick=[];
 app.innerHTML=head("حالا خودت بساز!",3)+`<div class="card">${pic(w).replace('class="pic"','class="pic" style="display:none"')}<div class="lbl">واژه را از روی حرف‌ها بساز</div><div class="ans" id="ans"></div><div class="tiles" id="tl"></div><div class="row"><button class="ghost" onclick="speak('${w.word}')">🔊 دوباره بشنو</button><button class="ghost" onclick="clr()">پاک کن</button></div><div class="row"><button id="ck" onclick="chk()" disabled>بررسی</button><button class="ghost" onclick="typ()">⌨ تایپ می‌کنم</button></div></div>`;drawT()}
function drawT(){$("#ans").innerHTML=S.pick.length?S.pick.map((i,k)=>`<button class="t ${S.tiles[i].t==ZW?"sm":""}" onclick="back(${k})">${S.tiles[i].t==ZW?"نیم‌فاصله":S.tiles[i].t}</button>`).join(""):'<span style="color:#9ab">حرف‌ها را اینجا بگذار</span>';
 $("#tl").innerHTML=S.tiles.map((x,i)=>`<button class="t ${x.t==ZW?"sm":""} ${x.u?"used":""}" onclick="put(${i})">${x.t==ZW?"نیم‌فاصله":x.t}</button>`).join("");$("#ck").disabled=!S.pick.length}
function put(i){S.tiles[i].u=1;S.pick.push(i);drawT()}
function back(k){const i=S.pick.splice(k,1)[0];S.tiles[i].u=0;drawT()}
function clr(){S.tiles.forEach(x=>x.u=0);S.pick=[];drawT()}
function chk(){answer(S.pick.map(i=>S.tiles[i].t).join("")===S.cur.w.word)}
function typ(){$("#tl").innerHTML=`<input id="ti" autocomplete="off" placeholder="اینجا بنویس">`;$("#ans").style.display="none";$("#ck").disabled=false;$("#ck").onclick=()=>answer(norm($("#ti").value)===norm(S.cur.w.word));$("#ti").focus()}
/* بازی ۲: شکارچی غلط‌ها */
function g2(){const w=S.cur.w;
 const o=shuf([w.word,...shuf(w.wrongForms.slice()).slice(0,2)]);
 app.innerHTML=head("غلط‌ها را شکار کن!",6)+`<div class="card"><div class="lbl">کدام شکل درست نوشته شده؟</div>${pic(w)}<button class="ghost" onclick="speak('${w.word}')">🔊 دوباره بشنو</button>${o.map(x=>`<button class="opt" data-v="${x}" onclick="p2(this)">${x}</button>`).join("")}</div>`;speak(w.word)}
function p2(el){if(S.fbOpen)return;S.fbOpen=true;const ok=el.dataset.v==S.cur.w.word;
 document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.v==S.cur.w.word)b.classList.add("good");else if(b==el)b.classList.add("soft")});answer(ok)}
/* بازی ۳: جای خالی هم‌صدا */
function g3(){const w=S.cur.w,h=w.hardLetter,g=CONF.find(x=>x.includes(h))||"";
 const o=shuf([h,...shuf([...g].filter(c=>c!==h)).slice(0,2)]);
 const s=w.sentence.replace("____",`<span class="bl">${w.word.replace(h,"▢")}</span>`);
 app.innerHTML=head("حرف گمشده را پیدا کن!",3)+`<div class="card"><div class="sent">${s}</div><button class="ghost" onclick="speak('${w.word}')">🔊 واژه را بشنو</button><div class="lbl" style="margin-top:12px">کدام حرف به جای ▢ می‌آید؟</div><div class="row">${o.map(x=>`<button class="t" data-v="${x}" onclick="p3(this)">${x}</button>`).join("")}</div></div>`;speak(w.word)}
function p3(el){if(S.fbOpen)return;S.fbOpen=true;answer(el.dataset.v==S.cur.w.hardLetter)}
function finish(){const ws=S.ws,w0=ws.filter(w=>S.stats[w.word].wrong>0);
 const st=w0.length==0?3:w0.length<=2?2:1;S.stars[S.lv]=st;S.rep[S.lv]=ws.map(w=>({word:w.word,...S.stats[w.word]}));
 const grow=Object.keys(S.stars).length;
 app.innerHTML=head("مرحله تمام شد!",7)+`<div class="card"><img class="pic" style="max-height:130px" alt="" src="${IMG["r"+(grow==4?8:GI[grow])]}"><div class="lbl">باغ تو بزرگ‌تر شد!</div><div>${`<img class="st" alt="" src="${IMG.r7}">`.repeat(st)}</div>
 ${w0.length?`<div class="note">واژه‌هایی که بیشتر تمرین کردی:<br><b>${w0.map(w=>w.word).join("، ")}</b></div>`:`<div class="note">همه‌ی واژه‌ها را درست نوشتی!</div>`}
 <div class="row" style="margin-top:14px"><button onclick="home()">بوستان</button>${S.lv<4?`<button class="alt" onclick="start(${S.lv+1})">مرحله‌ی بعد</button>`:""}</div></div>`}
function report(){const L=Object.keys(S.rep);
 app.innerHTML=`<div class="head"><div class="cat">📋</div><div class="bub">گزارش معلم</div></div>`+(L.length?L.map(l=>`<div class="card"><b>مرحله ${l}: ${LVN[l-1]}</b><table><tr><th>واژه</th><th>درست</th><th>اشتباه</th><th>کند</th></tr>${S.rep[l].map(r=>`<tr class="${r.wrong||r.slow?"flag":""}"><td>${r.word}</td><td>${r.ok}</td><td>${r.wrong}</td><td>${r.slow}</td></tr>`).join("")}</table></div>`).join("")+`<div class="note">ردیف‌های رنگی یعنی دانش‌آموز در آن واژه اشتباه کرده یا بیش از ۲۰ ثانیه فکر کرده است. با بستن صفحه گزارش پاک می‌شود؛ اگر لازم است از صفحه عکس بگیرید.</div>`:`<div class="card">هنوز مرحله‌ای کامل نشده است.</div>`)+`<div class="row"><button onclick="home()">بازگشت</button></div>`}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
home();
</script>
</body></html>
