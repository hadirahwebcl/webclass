<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کسرستان؛ ماجراجویی کسرها</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;800&display=swap">
<style>
:root{--bg:#FFD9A0;--ink:#3B2314;--sky:#FFE9B8;--mint:#FFD35C;--peach:#FFC6A8;--ac:#A8321F;--ac2:#D9532F;--edge:#C47A2C;--act:#fff;--card:#FFF3D9;--empty:#FFFBF0;--sh:rgba(120,60,10,.3);--hi:rgba(255,255,255,.35);--ok:#1E6B2E;--no:#9A3F00;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1A12;--ink:#FFEBD0;--sky:#5A3A22;--mint:#C98A12;--peach:#6B3A2A;--ac:#FFB27A;--ac2:#FF8A50;--edge:#120A06;--act:#2A1206;--card:#40291B;--empty:#523622;--sh:rgba(0,0,0,.5);--hi:rgba(255,255,255,.05);--ok:#8BE39B;--no:#FFB777}}
:root[data-theme="dark"]{--bg:#2A1A12;--ink:#FFEBD0;--sky:#5A3A22;--mint:#C98A12;--peach:#6B3A2A;--ac:#FFB27A;--ac2:#FF8A50;--edge:#120A06;--act:#2A1206;--card:#40291B;--empty:#523622;--sh:rgba(0,0,0,.5);--hi:rgba(255,255,255,.05);--ok:#8BE39B;--no:#FFB777}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 Vazirmatn,Tahoma,system-ui,sans-serif;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:14px}
h1,h2{font-family:Lalezar,Vazirmatn,Tahoma,system-ui,sans-serif;font-weight:400;margin:0}
h1{font-size:2rem}h2{font-size:1.5rem}
header,.who,.pr,.row,.eq{display:flex;align-items:center;gap:10px}
header,.pr{justify-content:space-between}
.clay{background:var(--card);border-radius:28px;box-shadow:8px 10px 22px var(--sh),inset -5px -6px 12px rgba(0,0,0,.07),inset 5px 6px 12px var(--hi)}
#stage{padding:18px;margin:14px 0}
.bub{padding:10px 16px;flex:1;background:var(--sky);border-radius:24px 24px 24px 6px}
#ch{flex:none}
.btn{min-height:52px;min-width:52px;padding:0 22px;border:0;border-radius:26px;font:inherit;font-weight:800;background:var(--ac);color:var(--act);box-shadow:5px 6px 14px var(--sh),inset -3px -4px 8px rgba(0,0,0,.15),inset 3px 4px 8px rgba(255,255,255,.35);cursor:pointer}
.btn.alt{background:var(--sky);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:translateY(2px) scale(.98)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
label{display:block;margin:10px 0;font-weight:700}
.fld,.ans input{width:100%;min-height:52px;font:inherit;font-size:1.1rem;padding:0 16px;border-radius:18px;border:3px solid transparent;background:var(--empty);color:var(--ink);box-shadow:inset 3px 4px 9px var(--sh)}
.pr{font-weight:700;font-size:.95rem}
.pb{height:14px;border-radius:9px;background:var(--empty);box-shadow:inset 2px 3px 6px var(--sh);margin:6px 0 14px;overflow:hidden}
.pb b{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.25;font-weight:800;font-size:1.3rem}
.fr i{font-style:normal;padding:0 6px}.fr i:first-child{border-bottom:3px solid currentColor}
.eq{justify-content:center;flex-wrap:wrap;font-size:1.5rem;font-weight:800;margin:8px 0}
.ans{display:inline-flex;flex-direction:column;align-items:center}
.ans input{width:76px;text-align:center;padding:0}
.ans hr{width:68px;border:0;border-top:3px solid currentColor;margin:5px 0}
.bars>div{margin:8px 0}
.bar{display:flex;gap:4px;margin:6px 0}
.bar.wrap,.wrap{flex-wrap:wrap}
.bar i,.seg{flex:1 1 44px;min-width:0;height:44px;padding:0;border-radius:14px;background:var(--empty);border:2px solid var(--ink);display:grid;place-items:center;font:inherit;font-style:normal;color:var(--ink);cursor:default}
.seg{cursor:pointer}
.bar i.on,.seg.on{background:var(--mint);box-shadow:inset -2px -3px 6px rgba(0,0,0,.12)}
.q,.note{margin:8px 0}
.note{font-size:.9rem;opacity:.9}
.row{justify-content:center;flex-wrap:wrap;margin:14px 0}
.hints p{background:var(--peach);border-radius:20px;padding:10px 16px;margin:8px 0;box-shadow:4px 5px 12px var(--sh)}
.good{color:var(--ok);font-weight:800}.warn{color:var(--no);font-weight:800}
.star{font-size:2.4rem;letter-spacing:6px;text-align:center}
@keyframes pop{0%{transform:scale(.92)}50%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes sl{from{opacity:0;transform:translateX(-18px)}}
.pop{animation:pop .5s}.sl{animation:sl .35s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const $=s=>document.querySelector(s),KEY='kasrestan_rpg_v1_';
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

let AC=null,sOn=true;
function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tn(f,t,d,ty,v,f2){const c=AC;if(!c||!sOn)return;const T=c.currentTime+t,o=c.createOscillator(),k=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);k.gain.setValueAtTime(.0001,T);k.gain.exponentialRampToValueAtTime(v,T+.01);k.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(k);k.connect(c.destination);o.start(T);o.stop(T+d+.02)}

function ans(q){const[o,a,b,c,d]=q;if(o=='+'||o=='-'){const L=lcm(b,d),x=a*L/b,y=c*L/d;return[o=='+'?x+y:x-y,L]}if(o=='×')return[a*c,b*d];return[a*d,b*c]}
function bar(n,d){let h='';for(let j=0;j<Math.max(1,Math.ceil(n/d));j++){h+='<div class="bar">';for(let p=0;p<d;p++){const on=p<Math.min(d,Math.max(0,n-j*d));h+=`<i class="${on?'on':''}">${on?'●':''}</i>`}h+='</div>'}return h}
function clue(q){const o=q[0];if(o=='d')return'مخرج یعنی کل قسمت‌های مساوی و صورت یعنی چند قسمت از آن‌ها را رنگ می‌کنیم.';if(o=='×')return'صورت‌ها را در هم ضرب کن و مخرج‌ها را هم در هم؛ بعد اگر شد، ساده کن.';if(o=='÷')return'کسر دوم را برعکس کن و تقسیم را به ضرب تبدیل کن.';const w=o=='+'?'جمع':'کم';return q[2]==q[4]?`مخرج‌ها برابرند؛ فقط صورت‌ها را ${w} کن و مخرج همان می‌ماند.`:`اول مخرج‌ها را مشترک کن، بعد صورت‌ها را ${w} کن.`}
function exm(q){const o=q[0];if(o=='d')return`مثال: برای ${F(2,5)} شکل را ۵ قسمت مساوی کن و ۲ قسمت را رنگی کن.`;if(o=='×')return`مثال: ${F(2,3)} × ${F(3,5)} = ${F(6,15)} = ${F(2,5)}`;if(o=='÷')return`مثال: ${F(1,3)} ÷ ${F(1,6)} = ${F(1,3)} × ${F(6,1)} = ${F(6,3)} = ۲`;if(q[2]==q[4])return o=='+'?`مثال: ${F(1,6)} + ${F(3,6)} = ${F(4,6)} = ${F(2,3)}`:`مثال: ${F(5,8)} − ${F(2,8)} = ${F(3,8)}`;return o=='+'?`مثال: ${F(1,2)} + ${F(1,6)} = ${F(3,6)} + ${F(1,6)} = ${F(4,6)} = ${F(2,3)}`:`مثال: ${F(3,4)} − ${F(1,2)} = ${F(3,4)} − ${F(2,4)} = ${F(1,4)}`}
function sol(q){const[o,a,b,c,d]=q;if(o=='d')return`${F(a,b)}: شکل را ${fa(b)} قسمت مساوی کن و ${fa(a)} قسمت را رنگی کن.`;const[rn,rd]=ans(q),s=g(rn,rd),sg=o=='-'?'−':o;let L=[];if(o=='+'||o=='-'){if(b==d)L.push(`${F(a,b)} ${sg} ${F(c,d)} = ${F(rn,rd)}`);else{const M=rd;L.push(`${F(a,b)} = ${F(a*M/b,M)} و ${F(c,d)} = ${F(c*M/d,M)}`,`${F(a*M/b,M)} ${sg} ${F(c*M/d,M)} = ${F(rn,rd)}`)}}else if(o=='×')L.push(`${F(a,b)} × ${F(c,d)} = ${F(rn,rd)}`);else L.push(`${F(a,b)} ÷ ${F(c,d)} = ${F(a,b)} × ${F(d,c)} = ${F(rn,rd)}`);if(s>1)L.push(`ساده‌شده: ${F(rn/s,rd/s)}`);return(q[5]?`عملیات این مسئله «${{'+':'جمع','-':'تفریق','×':'ضرب','÷':'تقسیم'}[o]}» است.<br>`:'')+L.join('<br>')}
// ===== ذخیره =====
function save(){try{localStorage.setItem(KEY+'s',JSON.stringify({name:S.name,cls:S.cls,i:S.i,score:S.score,miss:S.miss}))}catch(e){}}
function load(){try{saved=JSON.parse(localStorage.getItem(KEY+'s'))}catch(e){saved=null}}
// ===== صفحه‌ها =====
function enter(){const st=$('#stage');st.classList.remove('sl');void st.offsetWidth;st.classList.add('sl')}
function intro(){load();const st=$('#stage');st.innerHTML=`<h2>قهرمان خود را بساز</h2><p>در هر ماموریت، کسرها را روی شکل ببین و حل کن و سکه جمع کن. اشتباه یعنی تمرین قهرمان‌ها!</p><label>نام قهرمان<input class="fld" id="nm" autocomplete="off" maxlength="30"></label><label>کلاس قهرمان<input class="fld" id="cl" autocomplete="off" maxlength="20" placeholder="مثلاً ششم الف"></label><div class="row"><button class="btn" id="go" disabled>شروع ماجراجویی</button></div><p class="note" id="rs"></p>`;
 const nm=$('#nm'),cl=$('#cl'),go=$('#go');if(saved&&saved.i<Q.length&&saved.i>0){nm.value=saved.name||'';cl.value=saved.cls||'';$('#rs').textContent='پیشرفت قبلی پیدا شد. اگر همین نام و کلاس را بزنی، ادامه می‌دهیم.'}
 const up=()=>{go.disabled=!(nm.value.trim()&&cl.value.trim())};nm.oninput=cl.oninput=up;up();enter();
 go.onclick=()=>{const n=nm.value.trim(),c=cl.value.trim();if(!n||!c)return;S={name:n,cls:c,i:0,score:0,miss:[],att:0,fin:false};if(saved&&saved.name==n&&saved.cls==c&&saved.i>0&&saved.i<Q.length){S.i=saved.i;S.score=saved.score||0;S.miss=saved.miss||[]}say(`درود ${n}! ماموریت اول آماده است.`,'ok');snd.ok();render()}}
function render(){const q=Q[S.i];S.att=0;S.fin=false;$('#hints').innerHTML='';
 let h=`<div class="pr"><span>${q[5]?'👑 مرحله‌ی باس':'ماموریت'} ${fa(S.i+1)} از ${fa(Q.length)}</span><span>🪙 ${fa(S.score)} سکه</span></div><div class="pb" role="progressbar" aria-label="نوار تجربه" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${S.i}"><b style="width:${S.i/Q.length*100}%"></b></div>`;
 if(q[0]=='d')h+=`<p class="q">کسر ${F(q[1],q[2])} را روی شکل نشان بده. روی قسمت‌ها بزن تا رنگی شوند.</p><div class="bar wrap" id="dr">${Array.from({length:q[2]},(_,p)=>`<button class="seg" aria-pressed="false" aria-label="قسمت ${fa(p+1)}"></button>`).join('')}</div>`;
 else h+=`${q[5]?`<p class="q">${q[5].replace(/\{(\d+)\/(\d+)\}/g,(_,n,d)=>F(+n,+d))}</p>`:''}<div class="eq" dir="ltr">${q[5]?'':`${F(q[1],q[2])}<b>${q[0]=='-'?'−':q[0]}</b>${F(q[3],q[4])}<b>=</b>`}<span class="ans"><input id="n" inputmode="numeric" autocomplete="off" aria-label="صورت جواب" placeholder="؟"><hr><input id="d" inputmode="numeric" autocomplete="off" aria-label="مخرج جواب" placeholder="؟"></span></div><div class="bars"><div>${F(q[1],q[2])}${bar(q[1],q[2])}</div><div>${F(q[3],q[4])}${bar(q[3],q[4])}</div></div><p class="note">جواب را به شکل کسر بنویس؛ اگر جواب عدد صحیح است، مخرج را ۱ بگذار.</p>`;
 h+=`<div class="row"><button class="btn" id="ck">بررسی</button></div><div id="res"></div>`;$('#stage').innerHTML=h;enter();if(q[5]&&!(Q[S.i-1]&&Q[S.i-1][5]))say('به مرحله‌ی باس رسیدی! سه مسئله‌ی کوتاه از زندگی واقعی در انتظار توست.','ok');
 $('#ck').onclick=check;if(q[0]=='d')$('#dr').onclick=e=>{const b=e.target.closest('.seg');if(!b||S.fin)return;const on=b.classList.toggle('on');b.setAttribute('aria-pressed',on);b.textContent=on?'●':''};
 else{['#n','#d'].forEach(s=>$(s).onkeydown=e=>{if(e.key=='Enter')check()})}}
function hint(t){const p=document.createElement('p');p.innerHTML=t;$('#hints').appendChild(p)}
function finish(){S.fin=true;$('#ck').disabled=true;const b=document.createElement('button');b.className='btn alt';b.textContent=S.i+1<Q.length?'ماموریت بعدی':'دیدن غنیمت';b.onclick=()=>{S.i++;save();S.i<Q.length?render():end()};$('#res').appendChild(b);b.focus()}
function check(){const q=Q[S.i];if(S.fin)return;let ok,part='',sn,sd,rn,rd,un;
 if(q[0]=='d'){const k=document.querySelectorAll('.seg.on').length;ok=k==q[1];if(!ok)part=k==0?'هنوز قسمتی را رنگی نکرده‌ای.':`${fa(k)} قسمت رنگی کرده‌ای؛ ${k<q[1]?'کمی بیشتر':'کمی کمتر'} لازم است.`}
 else{const a=$('#n').value.trim(),b=$('#d').value.trim();un=+en(a);const ud=+en(b);if(!a||!b||isNaN(un)||!(ud>0)){say('اول صورت و مخرج را بنویس؛ مخرج باید بزرگ‌تر از صفر باشد.','oops');return}
  [rn,rd]=ans(q);const s=g(rn,rd);sn=rn/s;sd=rd/s;ok=un*rd==ud*rn;
  if(!ok){if(ud==rd||ud==sd){part='مخرج درست است ✓ ولی صورت را دوباره حساب کن.';$('#d').style.borderColor='var(--ok)'}else if(un==rn||un==sn){part='صورت درست است ✓ ولی مخرج را دوباره بررسی کن.';$('#n').style.borderColor='var(--ok)'}else part='هنوز درست نشده؛ نگران نباش! به شکل‌ها نگاه کن و دوباره امتحان کن.'}
  else if(!(un==sn&&ud==sd)&&s>1)part=`جواب درست است! شکل ساده‌شده‌اش ${F(sn,sd)} است.`}
 if(ok){const pts=3-S.att;S.score+=pts;snd.ok();say(['آفرین! عالی بود 🎉','احسنت! با تلاش دوباره درست شد.','دمت گرم! پشتکار یعنی همین.'][S.att]||'آفرین!','ok');
  $('#res').innerHTML=`<p class="good">✓ درست است! ${fa(pts)} سکه گرفتی.</p>${part?`<p>${part}</p>`:''}${q[0]!='d'?`<div>${F(sn,sd)}${bar(rn,rd)}</div>`:''}`;$('#hints').innerHTML='';finish();return}
 S.att++;snd.no();say(S.att<3?'اشتباه فرصت یادگیری است؛ یک راهنمایی بگیر!':'بیا با هم یاد بگیریم.','oops');
 if(S.att==1)hint('<b>راهنمای ۱:</b> '+part);else if(S.att==2)hint('<b>راهنمای ۲:</b> '+clue(q));
 else{hint('<b>راهنمای ۳:</b> '+exm(q));if(!$('#rv')){const b=document.createElement('button');b.className='btn alt';b.id='rv';b.textContent='ببین چطور حل می‌شود';b.onclick=()=>{S.miss.push(S.i);$('#res').innerHTML=`<p class="warn">راه حل:</p><p>${sol(q)}</p><p>مشکلی نیست! دفعه‌ی بعد این نوع سؤال را راحت‌تر حل می‌کنی.</p>`;if(q[0]!='d'){const[a,b]=ans(q);$('#res').innerHTML+=bar(a,b)}say('هر بار که تمرین کنی بهتر می‌شوی.','ok');finish()};$('.row').appendChild(b)}}}
function end(){const max=Q.length*3,st=Math.max(1,Math.round(3*S.score/max));snd.end();say(`${S.name}، آفرین! ماموریت‌ها تمام شد.`,'ok');save();
 $('#stage').innerHTML=`<h2>ماموریت کامل شد!</h2><img class="chest pop" alt="صندوق گنج پر از سکه" src="${CHEST}"><p class="star" aria-label="${fa(st)} ستاره از ۳">${'★'.repeat(st)}${'☆'.repeat(3-st)}</p><p>${S.name} از کلاس ${S.cls}، سکه‌های تو ${fa(S.score)} از ${fa(max)} است.</p><p>${S.miss.length?`در ${fa(S.miss.length)} سؤال از راه‌حل کمک گرفتی؛ دوباره بازی کن تا همه‌شان را خودت حل کنی.`:'همه‌ی سؤال‌ها را خودت حل کردی!'}</p><div class="row"><button class="btn" id="ag">ماجراجویی دوباره</button></div>`;$('#hints').innerHTML='';enter();$('#ag').onclick=()=>{S.i=0;S.score=0;S.miss=[];save();render()}}
intro();
</script>
</body>
</html>
