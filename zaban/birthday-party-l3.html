.wrap{max-width:520px;margin:auto;padding:14px}
.card{background:rgba(255,250,255,.9);backdrop-filter:blur(8px);border-radius:36px;padding:20px;box-shadow:var(--clay);margin-bottom:14px}
h1{margin:0 0 6px;font-size:27px;color:var(--pur);text-shadow:2px 2px 0 #fff}
h2{margin:0 0 8px;font-size:19px}p{margin:6px 0}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;margin:7px 0;border:none;border-radius:22px;background:#f3eeff;color:var(--ink);box-shadow:inset 4px 5px 10px rgba(130,100,200,.2),inset -4px -4px 9px #fff}
input:focus{outline:3px solid var(--pur)}
button{font:inherit;font-size:17px;cursor:pointer;border:none;border-radius:26px;padding:14px;background:#fdfbff;color:var(--ink);width:100%;min-height:56px;margin:8px 0;box-shadow:var(--clay);transition:all .12s}
button:active{box-shadow:inset 5px 6px 12px rgba(130,100,200,.25),inset -4px -4px 9px #fff;transform:scale(.98)}
button:focus-visible{outline:3px solid var(--pur)}
.go{background:linear-gradient(145deg,#ffa6cd,#b79bff);color:#fff;font-weight:bold;text-shadow:0 1px 2px rgba(90,50,160,.35)}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.opt{direction:ltr;text-align:center;font-size:19px}
.opt.ok{background:#c8f5e3}.opt.no{background:#ffdbe3;opacity:.75;box-shadow:inset 5px 6px 12px rgba(255,122,147,.3),inset -4px -4px 9px #fff}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.top button{width:auto;min-height:42px;padding:4px 14px;margin:0;font-size:15px}
.bar{height:16px;background:#efe8ff;border-radius:10px;overflow:hidden;margin:10px 0;box-shadow:inset 3px 3px 6px rgba(130,100,200,.22),inset -3px -3px 6px #fff}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yel));border-radius:10px;transition:width .5s}
.guest{display:flex;gap:12px;align-items:center}
.face{font-size:50px;background:#fff0f8;border-radius:50%;width:80px;height:80px;display:grid;place-items:center;flex:none;box-shadow:var(--clay)}
.bub{background:#f3edff;border-radius:10px 26px 26px 26px;padding:10px 14px;flex:1;font-size:19px;font-weight:bold;box-shadow:inset 3px 3px 7px rgba(130,100,200,.15),inset -3px -3px 7px #fff}
.face img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.say{width:auto;min-height:38px;padding:2px 12px;margin:0 6px 0 0;font-size:16px}
.fb{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:24px;margin:10px 0;font-size:15px;box-shadow:var(--clay)}
.av{width:50px;height:auto;flex:none}
.fb.g{background:#d9f8ea}.fb.r{background:#ffe5ea}
.slot{direction:ltr;min-height:56px;font-size:26px;letter-spacing:4px;text-align:center;border-radius:22px;padding:7px;margin:10px 0;font-weight:bold;background:#f3eeff;box-shadow:inset 4px 5px 10px rgba(130,100,200,.22),inset -4px -4px 9px #fff}
.keys{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.keys button{width:54px;padding:6px;font-size:22px;margin:3px 0}
.row{display:flex;justify-content:space-between;border-bottom:2px dotted #e2d8ff;padding:5px 0;font-size:16px}
.story{background:linear-gradient(145deg,#fff1c4,#ffe3f1);border-radius:26px;padding:12px 14px;margin:8px 0;font-size:15.5px;box-shadow:var(--clay)}
.hero{display:flex;gap:8px;align-items:flex-end;margin:8px 0}.hero img{width:92px;height:auto;flex:none}.hero .story{flex:1;margin:0;border-radius:26px 26px 26px 8px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 1.5s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cf,.shake{animation:none}}
.lv{display:inline-block;background:var(--pur);color:#fff;border-radius:14px;padding:1px 13px;font-size:14px;box-shadow:2px 3px 6px rgba(130,100,200,.35)}
</style></head><body><div class="wrap" id="app"></div>
